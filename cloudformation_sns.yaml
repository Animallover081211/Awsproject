AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for SNS Topic - Task 3'

Parameters:
  StudentID:
    Type: String
    Default: YOUR_STUDENT_ID
    Description: Your Student ID (e.g., 1234567)
  SNSTopicName:
    Type: String
    Default: ImageAlerts
    Description: Name for the SNS topic
  EmailAddress:
    Type: String
    Default: example@email.com
    Description: Email address for notifications

Resources:
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${SNSTopicName}${StudentID}'
      DisplayName: ImageProcessingAlerts

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SNSTopic
      Protocol: email
      Endpoint: !Ref EmailAddress

Outputs:
  SNSTopicArn:
    Description: ARN of the SNS topic
    Value: !Ref SNSTopic
    Export:
      Name: !Sub '${AWS::StackName}-SNSTopicArn'
